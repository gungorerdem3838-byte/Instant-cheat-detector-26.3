name: Build CheatDetector 26.3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Proje Dosyalarini ve Kaynak Kodlarini Olustur
        run: |
          mkdir -p src/main/java/kgd/cheatdetector/commands
          mkdir -p src/main/java/kgd/cheatdetector/listeners
          mkdir -p src/main/java/kgd/cheatdetector/managers
          mkdir -p src/main/java/kgd/cheatdetector/utils
          mkdir -p src/main/resources

          # Paper repo uzerinden mevcut en son 26.x / 1.21.11+ API versiyonunu otomatik tespit et
          PAPER_VER=$(curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | grep -oP '(?<=<version>).*?(?=</version>)' | tail -n 1)
          if [ -z "$PAPER_VER" ]; then
            PAPER_VER="1.21.4-R0.1-SNAPSHOT"
          fi
          echo "Tespit edilen Paper API surumu: $PAPER_VER"

          # 1. pom.xml
          cat << EOF > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>kgd.cheatdetector</groupId>
              <artifactId>CheatDetector</artifactId>
              <version>2.3.1-26.3</version>
              <packaging>jar</packaging>

              <properties>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc-repo</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>${PAPER_VER}</version>
                      <scope>provided</scope>
                  </dependency>
                  <dependency>
                      <groupId>io.netty</groupId>
                      <artifactId>netty-all</artifactId>
                      <version>4.1.115.Final</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <finalName>CheatDetector-26.3</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                              <proc>none</proc>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          # 2. plugin.yml
          cat << 'EOF' > src/main/resources/plugin.yml
          name: CheatDetector
          version: '2.3.1-26.3'
          main: kgd.cheatdetector.CheatDetector
          api-version: '1.21'
          authors: [ Lovecraft, KGD ]
          description: Hybrid Sign-Translation and Brand Cheat Detector updated for Paper 26.3
          commands:
            cheatdetector:
              aliases: [ cd ]
              description: CheatDetector ana komutu
              permission: cheatdetector.admin
          permissions:
            cheatdetector.admin:
              default: op
            cheatdetector.alerts:
              default: op
            cheatdetector.bypass:
              default: false
          EOF

          # 3. config.yml
          cat << 'EOF' > src/main/resources/config.yml
          settings:
            scan-delay: 40
            timeout-ticks: 100
            enable-sign-check: true
            enable-brand-check: true
            lock-movement-during-scan: true
            skip-bedrock-players: true
            punish-command: "kick %player% &c[CheatDetector] Yasakli mod tespit edildi: &e%cheat%"
            timeout-kick-enabled: true

          teleport-settings:
            pre-scan-tp: false
            return-after-scan: true
            inspect-world: "world"
            inspect-x: 0.5
            inspect-y: 150.0
            inspect-z: 0.5
            post-scan-spawn-tp: false
            spawn-world: "world"
            spawn-x: 0.5
            spawn-y: 64.0
            spawn-z: 0.5

          whitelist:
            players: []
            brands:
              - "vanilla"
              - "fabric"
              - "lunarclient"
              - "badlion"
              - "feather"
              - "optifine"
              - "geyser"

          blocked-brands:
            - "meteor"
            - "wurst"
            - "impact"
            - "aristois"
            - "liquidbounce"
            - "inertia"
            - "rusherhack"
            - "doomsday"

          sign-checks:
            meteor_client:
              mode: "KEYBIND"
              key: "key.meteor-client.open-gui"
              fallback: "key.meteor-client.open-gui"
              warning: "Meteor Client"
            freecam_standard:
              mode: "KEYBIND"
              key: "key.freecam.toggle"
              fallback: "key.freecam.toggle"
              warning: "Freecam Mod"
            wurst_zoom:
              mode: "KEYBIND"
              key: "key.wurst.zoom"
              fallback: "key.wurst.zoom"
              warning: "Wurst Client"
            tweakeroo_menu:
              mode: "TRANSLATABLE"
              key: "tweakeroo.gui.title.configs"
              fallback: "tweakeroo.gui.title.configs"
              warning: "Tweakeroo"
            itemscroller_gui:
              mode: "TRANSLATABLE"
              key: "itemscroller.gui.button.config_gui.generic"
              fallback: "itemscroller.gui.button.config_gui.generic"
              warning: "ItemScroller"
            xray_advanced:
              mode: "KEYBIND"
              key: "key.xray.toggle"
              fallback: "key.xray.toggle"
              warning: "X-Ray Mod"

          messages:
            prefix: "&8[&bCheatDetector&8] "
            reloaded: "&aYapilandirma dosyasi basariyla yenilendi (Paper 26.3)."
            no-permission: "&cBu komutu kullanmak icin yetkiniz yok."
            timeout-kick: "&c[CheatDetector] Tarama paketine yanit alinamadi!\n\n&7Olasi nedenler:\n&e- NoSignGUI / AntiSignExploit gibi modlar kullanmak\n&e- Yuksek ping / baglanti kopuklugu\n\n&aCozum: Tabela ekranini engelleyen modlari kapatip tekrar girin."
            timeout-admin-log: "&8[&bCheatDetector&8] &e%player% &7tabela paketine yanit vermedi (Zaman Asimi / NoSignGUI)."
            cheat-found-admin-log: "&8[&bCheatDetector&8] &c%player% &7yasakli istemci/mod nedeniyle yakalandi: &e%cheat%"
            player-clean-admin-log: "&8[&bCheatDetector&8] &a%player% &7taramayi temiz gecti."
          EOF

          # 4. SignCheckDefinition.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/managers/SignCheckDefinition.java
          package kgd.cheatdetector.managers;

          public class SignCheckDefinition {
              private final String id;
              private final String mode;
              private final String key;
              private final String fallback;
              private final String warning;

              public SignCheckDefinition(String id, String mode, String key, String fallback, String warning) {
                  this.id = id;
                  this.mode = mode != null ? mode.toUpperCase() : "KEYBIND";
                  this.key = key;
                  this.fallback = (fallback == null || fallback.isEmpty()) ? key : fallback;
                  this.warning = warning;
              }

              public String getId() { return id; }
              public String getMode() { return mode; }
              public String getKey() { return key; }
              public String getFallback() { return fallback; }
              public String getWarning() { return warning; }
          }
          EOF

          # 5. ConfigManager.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/managers/ConfigManager.java
          package kgd.cheatdetector.managers;

          import kgd.cheatdetector.CheatDetector;
          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.Location;
          import org.bukkit.World;
          import org.bukkit.configuration.ConfigurationSection;
          import org.bukkit.configuration.file.FileConfiguration;

          import java.util.ArrayList;
          import java.util.List;

          public class ConfigManager {
              private final CheatDetector plugin;
              private int scanDelay;
              private int timeoutTicks;
              private boolean enableSignCheck;
              private boolean enableBrandCheck;
              private boolean lockMovement;
              private boolean skipBedrock;
              private boolean timeoutKickEnabled;
              private String punishCommand;

              private TpSettings tpSettings;
              private List<String> whitelistedPlayers;
              private List<String> whitelistedBrands;
              private List<String> blockedBrands;
              private List<SignCheckDefinition> signChecks;

              public ConfigManager(CheatDetector plugin) {
                  this.plugin = plugin;
                  reload();
              }

              public void reload() {
                  plugin.saveDefaultConfig();
                  plugin.reloadConfig();
                  FileConfiguration cfg = plugin.getConfig();

                  this.scanDelay = cfg.getInt("settings.scan-delay", 40);
                  this.timeoutTicks = cfg.getInt("settings.timeout-ticks", 100);
                  this.enableSignCheck = cfg.getBoolean("settings.enable-sign-check", true);
                  this.enableBrandCheck = cfg.getBoolean("settings.enable-brand-check", true);
                  this.lockMovement = cfg.getBoolean("settings.lock-movement-during-scan", true);
                  this.skipBedrock = cfg.getBoolean("settings.skip-bedrock-players", true);
                  this.timeoutKickEnabled = cfg.getBoolean("settings.timeout-kick-enabled", true);
                  this.punishCommand = cfg.getString("settings.punish-command", "kick %player% &cYasakli mod: %cheat%");

                  this.tpSettings = new TpSettings(
                          cfg.getBoolean("teleport-settings.pre-scan-tp", false),
                          cfg.getBoolean("teleport-settings.return-after-scan", true),
                          cfg.getString("teleport-settings.inspect-world", "world"),
                          cfg.getDouble("teleport-settings.inspect-x", 0.5),
                          cfg.getDouble("teleport-settings.inspect-y", 150.0),
                          cfg.getDouble("teleport-settings.inspect-z", 0.5),
                          cfg.getBoolean("teleport-settings.post-scan-spawn-tp", false),
                          cfg.getString("teleport-settings.spawn-world", "world"),
                          cfg.getDouble("teleport-settings.spawn-x", 0.5),
                          cfg.getDouble("teleport-settings.spawn-y", 64.0),
                          cfg.getDouble("teleport-settings.spawn-z", 0.5)
                  );

                  this.whitelistedPlayers = cfg.getStringList("whitelist.players");
                  this.whitelistedBrands = cfg.getStringList("whitelist.brands");
                  this.blockedBrands = cfg.getStringList("blocked-brands");

                  this.signChecks = new ArrayList<>();
                  ConfigurationSection section = cfg.getConfigurationSection("sign-checks");
                  if (section != null) {
                      for (String key : section.getKeys(false)) {
                          String mode = section.getString(key + ".mode", "KEYBIND");
                          String transKey = section.getString(key + ".key", "");
                          String fallback = section.getString(key + ".fallback", transKey);
                          String warning = section.getString(key + ".warning", key);
                          if (!transKey.isEmpty()) {
                              signChecks.add(new SignCheckDefinition(key, mode, transKey, fallback, warning));
                          }
                      }
                  }
              }

              @SuppressWarnings("deprecation")
              public String getMessage(String path) {
                  String raw = plugin.getConfig().getString("messages." + path, "&cMesaj bulunamadi: " + path);
                  return ChatColor.translateAlternateColorCodes('&', raw);
              }

              public int getScanDelay() { return scanDelay; }
              public int getTimeoutTicks() { return timeoutTicks; }
              public boolean isEnableSignCheck() { return enableSignCheck; }
              public boolean isEnableBrandCheck() { return enableBrandCheck; }
              public boolean isLockMovement() { return lockMovement; }
              public boolean isSkipBedrock() { return skipBedrock; }
              public boolean isTimeoutKickEnabled() { return timeoutKickEnabled; }
              public String getPunishCommand() { return punishCommand; }
              public TpSettings getTpSettings() { return tpSettings; }
              public List<String> getWhitelistedPlayers() { return whitelistedPlayers; }
              public List<String> getWhitelistedBrands() { return whitelistedBrands; }
              public List<String> getBlockedBrands() { return blockedBrands; }
              public List<SignCheckDefinition> getSignChecks() { return signChecks; }

              public static class TpSettings {
                  private final boolean preScanTp;
                  private final boolean returnAfterScan;
                  private final String inspectWorld;
                  private final double inspectX, inspectY, inspectZ;
                  private final boolean postScanSpawnTp;
                  private final String spawnWorld;
                  private final double spawnX, spawnY, spawnZ;

                  public TpSettings(boolean preScanTp, boolean returnAfterScan, String inspectWorld,
                                    double inspectX, double inspectY, double inspectZ,
                                    boolean postScanSpawnTp, String spawnWorld,
                                    double spawnX, double spawnY, double spawnZ) {
                      this.preScanTp = preScanTp;
                      this.returnAfterScan = returnAfterScan;
                      this.inspectWorld = inspectWorld;
                      this.inspectX = inspectX;
                      this.inspectY = inspectY;
                      this.inspectZ = inspectZ;
                      this.postScanSpawnTp = postScanSpawnTp;
                      this.spawnWorld = spawnWorld;
                      this.spawnX = spawnX;
                      this.spawnY = spawnY;
                      this.spawnZ = spawnZ;
                  }

                  public boolean isPreScanTp() { return preScanTp; }
                  public boolean isReturnAfterScan() { return returnAfterScan; }
                  public boolean isPostScanSpawnTp() { return postScanSpawnTp; }

                  public Location getInspectLocation(Location fallback) {
                      World w = Bukkit.getWorld(inspectWorld);
                      return w != null ? new Location(w, inspectX, inspectY, inspectZ) : fallback;
                  }

                  public Location getSpawnLocation(Location fallback) {
                      World w = Bukkit.getWorld(spawnWorld);
                      return w != null ? new Location(w, spawnX, spawnY, spawnZ) : fallback;
                  }
              }
          }
          EOF

          # 6. WhitelistUtil.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/utils/WhitelistUtil.java
          package kgd.cheatdetector.utils;

          import kgd.cheatdetector.CheatDetector;
          import org.bukkit.entity.Player;

          public class WhitelistUtil {
              public static boolean isExempt(Player player) {
                  if (player.hasPermission("cheatdetector.bypass")) {
                      return true;
                  }
                  CheatDetector plugin = CheatDetector.getInstance();
                  if (plugin.getConfigManager().getWhitelistedPlayers().contains(player.getName())) {
                      return true;
                  }
                  if (plugin.getConfigManager().isSkipBedrock()) {
                      if (player.getUniqueId().version() == 0 || player.getName().startsWith(".")) {
                          return true;
                      }
                  }
                  return false;
              }
          }
          EOF

          # 7. PunishManager.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/managers/PunishManager.java
          package kgd.cheatdetector.managers;

          import kgd.cheatdetector.CheatDetector;
          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.entity.Player;

          public class PunishManager {
              private final CheatDetector plugin;

              public PunishManager(CheatDetector plugin) {
                  this.plugin = plugin;
              }

              @SuppressWarnings("deprecation")
              public void flagAndPunish(Player player, String cheatWarning) {
                  Bukkit.getScheduler().runTask(plugin, () -> {
                      if (!player.isOnline()) return;

                      String adminMsg = plugin.getConfigManager().getMessage("cheat-found-admin-log")
                              .replace("%player%", player.getName())
                              .replace("%cheat%", cheatWarning);

                      Bukkit.getConsoleSender().sendMessage(adminMsg);
                      for (Player online : Bukkit.getOnlinePlayers()) {
                          if (online.hasPermission("cheatdetector.alerts")) {
                              online.sendMessage(adminMsg);
                          }
                      }

                      String cmd = plugin.getConfigManager().getPunishCommand()
                              .replace("%player%", player.getName())
                              .replace("%cheat%", ChatColor.stripColor(cheatWarning));
                      if (cmd.startsWith("/")) {
                          cmd = cmd.substring(1);
                      }
                      Bukkit.dispatchCommand(Bukkit.getConsoleSender(), ChatColor.translateAlternateColorCodes('&', cmd));
                  });
              }

              @SuppressWarnings("deprecation")
              public void handleTimeout(Player player) {
                  Bukkit.getScheduler().runTask(plugin, () -> {
                      if (!player.isOnline()) return;

                      String adminMsg = plugin.getConfigManager().getMessage("timeout-admin-log")
                              .replace("%player%", player.getName());

                      Bukkit.getConsoleSender().sendMessage(adminMsg);
                      for (Player online : Bukkit.getOnlinePlayers()) {
                          if (online.hasPermission("cheatdetector.alerts")) {
                              online.sendMessage(adminMsg);
                          }
                      }

                      if (plugin.getConfigManager().isTimeoutKickEnabled()) {
                          player.kickPlayer(plugin.getConfigManager().getMessage("timeout-kick"));
                      }
                  });
              }

              public void logClean(Player player) {
                  String cleanMsg = plugin.getConfigManager().getMessage("player-clean-admin-log")
                          .replace("%player%", player.getName());
                  Bukkit.getConsoleSender().sendMessage(cleanMsg);
              }
          }
          EOF

          # 8. SignUtil.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/utils/SignUtil.java
          package kgd.cheatdetector.utils;

          import io.netty.channel.Channel;
          import io.netty.channel.ChannelDuplexHandler;
          import io.netty.channel.ChannelHandlerContext;
          import kgd.cheatdetector.CheatDetector;
          import kgd.cheatdetector.managers.SignCheckDefinition;
          import net.kyori.adventure.text.Component;
          import org.bukkit.Bukkit;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.block.Block;
          import org.bukkit.block.Sign;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.block.sign.Side;
          import org.bukkit.block.sign.SignSide;
          import org.bukkit.entity.Player;

          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.util.List;

          public class SignUtil {
              private static final String HANDLER_NAME = "kgd_cheatdetector_packet_handler";

              public static void injectPacketListener(Player player) {
                  Channel channel = getChannel(player);
                  if (channel == null || channel.pipeline().get(HANDLER_NAME) != null) return;

                  channel.pipeline().addBefore("packet_handler", HANDLER_NAME, new ChannelDuplexHandler() {
                      @Override
                      public void channelRead(ChannelHandlerContext ctx, Object msg) throws Exception {
                          String packetName = msg.getClass().getSimpleName();
                          if (packetName.contains("SignUpdate") || packetName.contains("PacketPlayInUpdateSign")) {
                              String[] lines = extractLinesFromPacket(msg);
                              if (lines != null && lines.length > 0) {
                                  Bukkit.getScheduler().runTask(CheatDetector.getInstance(), () -> {
                                      CheatDetector.getInstance().getSignDetectManager().handleSignResponse(player, lines);
                                  });
                              }
                          }
                          super.channelRead(ctx, msg);
                      }
                  });
              }

              public static void uninjectPacketListener(Player player) {
                  Channel channel = getChannel(player);
                  if (channel != null && channel.pipeline().get(HANDLER_NAME) != null) {
                      channel.eventLoop().submit(() -> {
                          if (channel.pipeline().get(HANDLER_NAME) != null) {
                              channel.pipeline().remove(HANDLER_NAME);
                          }
                          return null;
                      });
                  }
              }

              public static void sendSignProbe(Player player, Location signLoc, List<SignCheckDefinition> batch) {
                  Block block = signLoc.getBlock();
                  BlockData originalData = block.getBlockData().clone();

                  block.setType(Material.OAK_SIGN, false);
                  if (block.getState() instanceof Sign sign) {
                      SignSide front = sign.getSide(Side.FRONT);
                      for (int i = 0; i < 4; i++) {
                          if (i < batch.size()) {
                              SignCheckDefinition def = batch.get(i);
                              if ("KEYBIND".equalsIgnoreCase(def.getMode())) {
                                  front.line(i, Component.keybind(def.getKey()));
                              } else {
                                  front.line(i, Component.translatable(def.getKey(), def.getFallback()));
                              }
                          } else {
                              front.line(i, Component.empty());
                          }
                      }
                      sign.update(true, false);
                      player.openSign(sign, Side.FRONT);
                  }

                  Bukkit.getScheduler().runTaskLater(CheatDetector.getInstance(), () -> {
                      block.setBlockData(originalData, false);
                      if (player.isOnline()) {
                          player.sendBlockChange(signLoc, originalData);
                      }
                  }, 4L);
              }

              private static String[] extractLinesFromPacket(Object packet) {
                  try {
                      for (Method method : packet.getClass().getMethods()) {
                          if (method.getParameterCount() == 0 && method.getReturnType().equals(String[].class)) {
                              return (String[]) method.invoke(packet);
                          }
                      }
                      for (Field field : packet.getClass().getDeclaredFields()) {
                          if (field.getType().equals(String[].class)) {
                              field.setAccessible(true);
                              return (String[]) field.get(packet);
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private static Channel getChannel(Player player) {
                  try {
                      Method getHandle = player.getClass().getMethod("getHandle");
                      Object serverPlayer = getHandle.invoke(player);
                      for (Field f : serverPlayer.getClass().getDeclaredFields()) {
                          f.setAccessible(true);
                          Object conn = f.get(serverPlayer);
                          if (conn != null && (conn.getClass().getSimpleName().contains("GamePacketListener")
                                  || conn.getClass().getSimpleName().contains("PlayerConnection"))) {
                              Channel ch = findChannelInObject(conn, conn.getClass().getSuperclass());
                              if (ch != null) return ch;
                              ch = findChannelInObject(conn, conn.getClass());
                              if (ch != null) return ch;
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private static Channel findChannelInObject(Object conn, Class<?> clazz) {
                  if (clazz == null) return null;
                  try {
                      for (Field cf : clazz.getDeclaredFields()) {
                          cf.setAccessible(true);
                          Object netMgr = cf.get(conn);
                          if (netMgr != null) {
                              for (Field chField : netMgr.getClass().getDeclaredFields()) {
                                  if (Channel.class.isAssignableFrom(chField.getType())) {
                                      chField.setAccessible(true);
                                      return (Channel) chField.get(netMgr);
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }
          }
          EOF

          # 9. SignDetectManager.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/managers/SignDetectManager.java
          package kgd.cheatdetector.managers;

          import kgd.cheatdetector.CheatDetector;
          import kgd.cheatdetector.utils.SignUtil;
          import kgd.cheatdetector.utils.WhitelistUtil;
          import org.bukkit.Bukkit;
          import org.bukkit.Location;
          import org.bukkit.entity.Player;
          import org.bukkit.scheduler.BukkitTask;

          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;

          public class SignDetectManager {
              private final CheatDetector plugin;
              private final Map<UUID, CheckState> activeScans = new ConcurrentHashMap<>();

              public SignDetectManager(CheatDetector plugin) {
                  this.plugin = plugin;
              }

              public void startScan(Player player) {
                  if (!player.isOnline() || WhitelistUtil.isExempt(player)) return;
                  if (!plugin.getConfigManager().isEnableSignCheck()) return;

                  List<SignCheckDefinition> allChecks = plugin.getConfigManager().getSignChecks();
                  if (allChecks.isEmpty()) return;

                  stopScan(player.getUniqueId());

                  Location originalLoc = player.getLocation().clone();
                  ConfigManager.TpSettings tp = plugin.getConfigManager().getTpSettings();
                  if (tp.isPreScanTp()) {
                      player.teleport(tp.getInspectLocation(originalLoc));
                  }

                  CheckState state = new CheckState(player.getUniqueId(), originalLoc, allChecks);
                  activeScans.put(player.getUniqueId(), state);

                  SignUtil.injectPacketListener(player);
                  sendNextBatch(player, state);
              }

              private void sendNextBatch(Player player, CheckState state) {
                  if (!player.isOnline()) {
                      stopScan(player.getUniqueId());
                      return;
                  }

                  List<SignCheckDefinition> batch = state.nextBatch();
                  if (batch.isEmpty()) {
                      finishCleanScan(player, state);
                      return;
                  }

                  Location signLoc = player.getLocation().clone().add(0, 2, 0);
                  SignUtil.sendSignProbe(player, signLoc, batch);

                  if (state.getTimeoutTask() != null) {
                      state.getTimeoutTask().cancel();
                  }

                  BukkitTask task = Bukkit.getScheduler().runTaskLater(plugin, () -> {
                      if (activeScans.containsKey(player.getUniqueId())) {
                          stopScan(player.getUniqueId());
                          plugin.getPunishManager().handleTimeout(player);
                      }
                  }, plugin.getConfigManager().getTimeoutTicks());

                  state.setTimeoutTask(task);
              }

              public void handleSignResponse(Player player, String[] lines) {
                  CheckState state = activeScans.get(player.getUniqueId());
                  if (state == null || state.isCompleted()) return;

                  if (state.getTimeoutTask() != null) {
                      state.getTimeoutTask().cancel();
                  }

                  List<SignCheckDefinition> currentBatch = state.getCurrentBatch();
                  for (int i = 0; i < currentBatch.size() && i < lines.length; i++) {
                      SignCheckDefinition def = currentBatch.get(i);
                      String received = lines[i] != null ? lines[i].trim() : "";

                      if (!received.isEmpty() && !received.equals(def.getKey()) && !received.equals(def.getFallback())) {
                          state.setCompleted(true);
                          stopScan(player.getUniqueId());
                          plugin.getPunishManager().flagAndPunish(player, def.getWarning() + " (" + received + ")");
                          return;
                      }
                  }

                  Bukkit.getScheduler().runTaskLater(plugin, () -> {
                      if (activeScans.containsKey(player.getUniqueId())) {
                          sendNextBatch(player, state);
                      }
                  }, 6L);
              }

              private void finishCleanScan(Player player, CheckState state) {
                  state.setCompleted(true);
                  stopScan(player.getUniqueId());

                  ConfigManager.TpSettings tp = plugin.getConfigManager().getTpSettings();
                  if (tp.isPostScanSpawnTp()) {
                      player.teleport(tp.getSpawnLocation(state.getOriginalLocation()));
                  } else if (tp.isPreScanTp() && tp.isReturnAfterScan()) {
                      player.teleport(state.getOriginalLocation());
                  }

                  plugin.getPunishManager().logClean(player);
              }

              public boolean isScanning(UUID uuid) {
                  return activeScans.containsKey(uuid);
              }

              public void stopScan(UUID uuid) {
                  CheckState state = activeScans.remove(uuid);
                  if (state != null && state.getTimeoutTask() != null) {
                      state.getTimeoutTask().cancel();
                  }
                  Player p = Bukkit.getPlayer(uuid);
                  if (p != null) {
                      SignUtil.uninjectPacketListener(p);
                  }
              }

              public static class CheckState {
                  private final UUID playerUuid;
                  private final Location originalLocation;
                  private final List<SignCheckDefinition> allChecks;
                  private List<SignCheckDefinition> currentBatch = Collections.emptyList();
                  private int cursor = 0;
                  private BukkitTask timeoutTask;
                  private boolean completed = false;

                  public CheckState(UUID playerUuid, Location originalLocation, List<SignCheckDefinition> allChecks) {
                      this.playerUuid = playerUuid;
                      this.originalLocation = originalLocation;
                      this.allChecks = new ArrayList<>(allChecks);
                  }

                  public List<SignCheckDefinition> nextBatch() {
                      if (cursor >= allChecks.size()) {
                          currentBatch = Collections.emptyList();
                          return currentBatch;
                      }
                      int end = Math.min(cursor + 4, allChecks.size());
                      currentBatch = allChecks.subList(cursor, end);
                      cursor = end;
                      return currentBatch;
                  }

                  public UUID getPlayerUuid() { return playerUuid; }
                  public Location getOriginalLocation() { return originalLocation; }
                  public List<SignCheckDefinition> getCurrentBatch() { return currentBatch; }
                  public BukkitTask getTimeoutTask() { return timeoutTask; }
                  public void setTimeoutTask(BukkitTask timeoutTask) { this.timeoutTask = timeoutTask; }
                  public boolean isCompleted() { return completed; }
                  public void setCompleted(boolean completed) { this.completed = completed; }
              }
          }
          EOF

          # 10. BrandListener.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/listeners/BrandListener.java
          package kgd.cheatdetector.listeners;

          import kgd.cheatdetector.CheatDetector;
          import kgd.cheatdetector.utils.WhitelistUtil;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerClientBrandEvent;
          import org.bukkit.plugin.messaging.PluginMessageListener;
          import org.jetbrains.annotations.NotNull;

          import java.nio.charset.StandardCharsets;

          public class BrandListener implements Listener, PluginMessageListener {
              private final CheatDetector plugin;

              public BrandListener(CheatDetector plugin) {
                  this.plugin = plugin;
              }

              @EventHandler
              public void onClientBrand(PlayerClientBrandEvent event) {
                  checkBrand(event.getPlayer(), event.getClientBrand());
              }

              @Override
              public void onPluginMessageReceived(@NotNull String channel, @NotNull Player player, byte[] message) {
                  if (!channel.equals("minecraft:brand") && !channel.equals("MC|Brand")) return;
                  if (message.length == 0) return;
                  String brand = new String(message, StandardCharsets.UTF_8).trim();
                  if (brand.length() > 1) {
                      brand = brand.substring(1);
                  }
                  checkBrand(player, brand);
              }

              private void checkBrand(Player player, String brand) {
                  if (!plugin.getConfigManager().isEnableBrandCheck()) return;
                  if (brand == null || WhitelistUtil.isExempt(player)) return;

                  String lower = brand.toLowerCase();
                  for (String blocked : plugin.getConfigManager().getBlockedBrands()) {
                      if (lower.contains(blocked.toLowerCase())) {
                          plugin.getPunishManager().flagAndPunish(player, "Client Brand (" + brand + ")");
                          return;
                      }
                  }
              }
          }
          EOF

          # 11. JoinListener.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/listeners/JoinListener.java
          package kgd.cheatdetector.listeners;

          import kgd.cheatdetector.CheatDetector;
          import kgd.cheatdetector.utils.WhitelistUtil;
          import org.bukkit.Bukkit;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.event.player.PlayerQuitEvent;

          public class JoinListener implements Listener {
              private final CheatDetector plugin;

              public JoinListener(CheatDetector plugin) {
                  this.plugin = plugin;
              }

              @EventHandler
              public void onJoin(PlayerJoinEvent event) {
                  Player player = event.getPlayer();
                  if (WhitelistUtil.isExempt(player)) return;

                  Bukkit.getScheduler().runTaskLater(plugin, () -> {
                      if (player.isOnline()) {
                          plugin.getSignDetectManager().startScan(player);
                      }
                  }, plugin.getConfigManager().getScanDelay());
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent event) {
                  plugin.getSignDetectManager().stopScan(event.getPlayer().getUniqueId());
              }

              @EventHandler
              public void onMove(PlayerMoveEvent event) {
                  if (!plugin.getConfigManager().isLockMovement()) return;
                  if (plugin.getSignDetectManager().isScanning(event.getPlayer().getUniqueId())) {
                      if (event.getFrom().getX() != event.getTo().getX() ||
                          event.getFrom().getZ() != event.getTo().getZ()) {
                          event.setTo(event.getFrom());
                      }
                  }
              }
          }
          EOF

          # 12. SignListener.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/listeners/SignListener.java
          package kgd.cheatdetector.listeners;

          import kgd.cheatdetector.CheatDetector;
          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.serializer.plain.PlainTextComponentSerializer;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.SignChangeEvent;

          import java.util.List;

          public class SignListener implements Listener {
              private final CheatDetector plugin;

              public SignListener(CheatDetector plugin) {
                  this.plugin = plugin;
              }

              @EventHandler(priority = EventPriority.LOWEST)
              public void onSignChange(SignChangeEvent event) {
                  if (!plugin.getSignDetectManager().isScanning(event.getPlayer().getUniqueId())) return;
                  event.setCancelled(true);

                  List<Component> compLines = event.lines();
                  String[] plainLines = new String[compLines.size()];
                  for (int i = 0; i < compLines.size(); i++) {
                      plainLines[i] = PlainTextComponentSerializer.plainText().serialize(compLines.get(i));
                  }
                  plugin.getSignDetectManager().handleSignResponse(event.getPlayer(), plainLines);
              }
          }
          EOF

          # 13. CheatDetectorCommand.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/commands/CheatDetectorCommand.java
          package kgd.cheatdetector.commands;

          import kgd.cheatdetector.CheatDetector;
          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.command.Command;
          import org.bukkit.command.CommandExecutor;
          import org.bukkit.command.CommandSender;
          import org.bukkit.command.TabCompleter;
          import org.bukkit.entity.Player;
          import org.jetbrains.annotations.NotNull;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;

          public class CheatDetectorCommand implements CommandExecutor, TabCompleter {
              private final CheatDetector plugin;

              public CheatDetectorCommand(CheatDetector plugin) {
                  this.plugin = plugin;
              }

              @Override
              @SuppressWarnings("deprecation")
              public boolean onCommand(@NotNull CommandSender sender, @NotNull Command command, @NotNull String label, @NotNull String[] args) {
                  if (!sender.hasPermission("cheatdetector.admin")) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("no-permission"));
                      return true;
                  }

                  if (args.length == 0) {
                      sender.sendMessage(ChatColor.AQUA + "CheatDetector v2.3.1 (Paper 26.3)");
                      sender.sendMessage(ChatColor.GRAY + "/" + label + " reload " + ChatColor.DARK_GRAY + "- Config yeniler");
                      sender.sendMessage(ChatColor.GRAY + "/" + label + " scan <oyuncu> " + ChatColor.DARK_GRAY + "- Oyuncuyu tarar");
                      return true;
                  }

                  if (args[0].equalsIgnoreCase("reload")) {
                      plugin.getConfigManager().reload();
                      sender.sendMessage(plugin.getConfigManager().getMessage("reloaded"));
                      return true;
                  }

                  if (args[0].equalsIgnoreCase("scan") && args.length >= 2) {
                      Player target = Bukkit.getPlayer(args[1]);
                      if (target == null || !target.isOnline()) {
                          sender.sendMessage(ChatColor.RED + "Oyuncu cevrimici degil!");
                          return true;
                      }
                      plugin.getSignDetectManager().startScan(target);
                      sender.sendMessage(ChatColor.GREEN + target.getName() + " icin tabela hile taramasi baslatildi.");
                      return true;
                  }

                  return true;
              }

              @Override
              public List<String> onTabComplete(@NotNull CommandSender sender, @NotNull Command command, @NotNull String alias, @NotNull String[] args) {
                  if (args.length == 1) {
                      return Arrays.asList("reload", "scan");
                  }
                  if (args.length == 2 && args[0].equalsIgnoreCase("scan")) {
                      List<String> names = new ArrayList<>();
                      for (Player p : Bukkit.getOnlinePlayers()) {
                          names.add(p.getName());
                      }
                      return names;
                  }
                  return new ArrayList<>();
              }
          }
          EOF

          # 14. CheatDetector.java
          cat << 'EOF' > src/main/java/kgd/cheatdetector/CheatDetector.java
          package kgd.cheatdetector;

          import kgd.cheatdetector.commands.CheatDetectorCommand;
          import kgd.cheatdetector.listeners.BrandListener;
          import kgd.cheatdetector.listeners.JoinListener;
          import kgd.cheatdetector.listeners.SignListener;
          import kgd.cheatdetector.managers.ConfigManager;
          import kgd.cheatdetector.managers.PunishManager;
          import kgd.cheatdetector.managers.SignDetectManager;
          import org.bukkit.Bukkit;
          import org.bukkit.plugin.java.JavaPlugin;

          public class CheatDetector extends JavaPlugin {
              private static CheatDetector instance;
              private ConfigManager configManager;
              private PunishManager punishManager;
              private SignDetectManager signDetectManager;

              @Override
              public void onEnable() {
                  instance = this;
                  this.configManager = new ConfigManager(this);
                  this.punishManager = new PunishManager(this);
                  this.signDetectManager = new SignDetectManager(this);

                  BrandListener brandListener = new BrandListener(this);
                  Bukkit.getMessenger().registerIncomingPluginChannel(this, "minecraft:brand", brandListener);
                  Bukkit.getPluginManager().registerEvents(brandListener, this);
                  Bukkit.getPluginManager().registerEvents(new JoinListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new SignListener(this), this);

                  CheatDetectorCommand cmd = new CheatDetectorCommand(this);
                  if (getCommand("cheatdetector") != null) {
                      getCommand("cheatdetector").setExecutor(cmd);
                      getCommand("cheatdetector").setTabCompleter(cmd);
                  }

                  getLogger().info("CheatDetector Paper 26.3 surumu aktif edildi!");
              }

              @Override
              public void onDisable() {
                  Bukkit.getMessenger().unregisterIncomingPluginChannel(this);
              }

              public static CheatDetector getInstance() { return instance; }
              public ConfigManager getConfigManager() { return configManager; }
              public PunishManager getPunishManager() { return punishManager; }
              public SignDetectManager getSignDetectManager() { return signDetectManager; }
          }
